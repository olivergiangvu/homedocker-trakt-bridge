services:
  trakt-bridge:
    build: .
    image: homedocker-trakt-bridge:0.3.3
    container_name: trakt-bridge
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - trakt_bridge_data:/app/data
    # Host nginx terminates TLS; the application port stays loopback-only.
    ports:
      - "127.0.0.1:7000:7000"

volumes:
  trakt_bridge_data:
