name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test

      - name: Read-only identity audit regression tests
        run: |
          python3 -m py_compile scripts/audit-dual-imdb.py
          python3 -m py_compile scripts/monitor-identity-drift.py
          python3 -m py_compile scripts/audit-stable-event-pulse.py
          python3 -m py_compile scripts/audit-rolling-aio-contract.py
          python3 -m py_compile scripts/audit-aio-identity-readiness.py
          python3 -m py_compile scripts/audit-gateway-readiness.py
          python3 -m py_compile scripts/export-canary-identity-proof.py
          python3 -m py_compile scripts/audit-jellyfin-auth-preview.py
          python3 -m py_compile scripts/cleanup-github-branches.py
          python3 -m py_compile scripts/cleanup-rc7-canaries.py
          python3 -m py_compile scripts/audit-v140-performance.py
          python3 -m py_compile scripts/audit-dangling-image-ownership.py
          python3 -m py_compile scripts/publish-v1.3.0-tag.py
          python3 -m py_compile scripts/deploy-v1.3.0-homedocker.py
          python3 -m unittest discover -s test -p 'test_*.py'

      - name: Validate shell scripts
        shell: bash
        run: bash -n scripts/*.sh

      - name: Validate production and development Compose
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose -f compose.example.yml config -q
          docker compose -f compose.example.yml -f compose.dev.yml config -q

      - name: Build production container
        run: docker build -t homedocker-trakt-bridge:ci .

      - name: Build and smoke-test isolated gateway-only canary
        shell: bash
        run: |
          set -euo pipefail
          docker build -f Dockerfile.gateway-canary -t homedocker-nextup-gateway:ci .
          td=$(mktemp -d)
          cleanup() {
            docker rm -f nextup-gateway-ci >/dev/null 2>&1 || true
            sudo rm -rf "$td"
          }
          trap cleanup EXIT
          cat > "$td/identity-proof.json" <<'JSON'
          {"contract":"homedocker-canary-identity-proof-v1","profileId":"aaaaaaaaaaaaaaaaaaaaaaaa","graph":{"revision":1,"conflicts":[],"shows":{"263102":{"canonicalImdb":"tt44051354","aliases":["tt44094505"],"tmdb":null,"tvdb":null}}}}
          JSON
          chmod 600 "$td/identity-proof.json"
          sudo chown 1000:1000 "$td/identity-proof.json"
          docker run -d --name nextup-gateway-ci \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$td/identity-proof.json,dst=/run/identity-proof.json,readonly" \
            -p 127.0.0.1:17139:7101 \
            -e JELLYFIN_GATEWAY_AIO_USER_ID=12345678abcdef \
            -e JELLYFIN_GATEWAY_UPSTREAM_URL=http://127.0.0.1:3240 \
            homedocker-nextup-gateway:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:17139/health > "$td/health.json"; then
              break
            fi
            sleep 1
          done
          grep -q '"adapter":"nextup-only"' "$td/health.json"
          test "$(docker inspect nextup-gateway-ci --format '{{.State.Running}}')" = "true"
          echo "ISOLATED_GATEWAY_HEALTH=PASS"

      - name: Smoke-test v1.4 Gateway inside ONE Trakt Bridge runtime
        shell: bash
        run: |
          set -euo pipefail
          name="trakt-bridge-v14-module-ci"
          cleanup() { docker rm -f -v "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          # Synthetic keys only: CI is isolated and NEVER connects to a live
          # HomeDocker AIO, Trakt or production network.
          docker run -d --name "$name" \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:17041:7000 \
            -p 127.0.0.1:17141:7101 \
            -e PUBLIC_BASE_URL=http://127.0.0.1:17041 \
            -e TRAKT_CLIENT_ID=ci-client \
            -e TRAKT_CLIENT_SECRET=ci-fake-secret \
            -e BRIDGE_SECRET_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e ADMIN_KEY=abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789 \
            -e JELLYFIN_GATEWAY_ENABLED=true \
            -e JELLYFIN_GATEWAY_PORT=7101 \
            -e JELLYFIN_GATEWAY_AIO_USER_ID=11111111abcdef00 \
            -e JELLYFIN_GATEWAY_PROFILE_ID=aaaaaaaaaaaaaaaaaaaaaaaa \
            -e JELLYFIN_GATEWAY_UPSTREAM_URL=http://127.0.0.1:3240/jellyfin \
            -e JELLYFIN_GATEWAY_RESUME_PASSTHROUGH=false \
            homedocker-trakt-bridge:ci

          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:17041/health >/dev/null 2>&1 \
                && curl -fsS http://127.0.0.1:17141/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          test "$(docker inspect "$name" --format '{{.State.Running}}')" = "true"

          curl -fsS http://127.0.0.1:17141/health | grep -q '"adapter":"nextup-only"'
          code=$(curl -sS -o /tmp/ci-gw-unknown.json -w '%{http_code}' \
            http://127.0.0.1:17141/Users/Me)
          test "$code" = "404"

          key=abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
          curl -fsS "http://127.0.0.1:17041/setup?key=$key" \
            | grep -q 'AIO Identity Gateway'
          curl -fsS "http://127.0.0.1:17041/status?key=$key" \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); g=x["gateway"]; assert g["enabled"] is True; assert g["listening"] is True; assert g["productionRoutingQualified"] is False; assert g["resumeMode"] == "off"'
          echo "V140_SINGLE_BRIDGE_DASHBOARD_GATEWAY=PASS"

      - name: Enforce runtime image-size budget
        shell: bash
        run: |
          set -euo pipefail
          size=$(docker image inspect homedocker-trakt-bridge:ci --format '{{.Size}}')
          budget=$((122 * 1024 * 1024))
          python3 - "$size" "$budget" <<'PY'
          import sys
          size,budget=map(int,sys.argv[1:3])
          print(f"IMAGE_SIZE_MIB={size/1024/1024:.2f}")
          print(f"IMAGE_BUDGET_MIB={budget/1024/1024:.2f}")
          if size > budget:
              raise SystemExit("runtime image exceeds CI size budget")
          PY

      - name: Smoke-test health and readiness
        shell: bash
        run: |
          set -euo pipefail

          expected_version=$(node -p "require('./package.json').version")
          expected_schema=$(node --input-type=module -e "import { SCHEMA_VERSION } from './src/migrations.mjs'; process.stdout.write(String(SCHEMA_VERSION))")

          docker run -d --name trakt-bridge-ci \
            -p 127.0.0.1:17000:7000 \
            -e PUBLIC_BASE_URL=http://127.0.0.1:17000 \
            -e TRAKT_CLIENT_ID=test-client \
            -e TRAKT_CLIENT_SECRET=test-secret \
            -e BRIDGE_SECRET_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e ADMIN_KEY=abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789 \
            -e PULL_IDENTITY_MODE=trakt \
            homedocker-trakt-bridge:ci

          cleanup() { docker rm -f trakt-bridge-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:17000/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done

          grep -q "\"version\":\"${expected_version}\"" /tmp/health.json

          code=$(curl -sS -o /tmp/readiness.json -w '%{http_code}' http://127.0.0.1:17000/readiness)
          test "$code" = "503"
          grep -q '"status":"setup_required"' /tmp/readiness.json
          grep -q "\"schemaVersion\":${expected_schema}" /tmp/readiness.json
