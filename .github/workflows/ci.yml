name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test

      - name: Read-only identity audit regression tests
        run: |
          python3 -m py_compile scripts/audit-dual-imdb.py
          python3 -m py_compile scripts/monitor-identity-drift.py
          python3 -m py_compile scripts/audit-stable-event-pulse.py
          python3 -m py_compile scripts/audit-rolling-aio-contract.py
          python3 -m py_compile scripts/cleanup-github-branches.py
          python3 -m py_compile scripts/audit-dangling-image-ownership.py
          python3 -m py_compile scripts/publish-v1.3.0-tag.py
          python3 -m py_compile scripts/deploy-v1.3.0-homedocker.py
          python3 -m unittest discover -s test -p 'test_*.py'

      - name: Validate shell scripts
        shell: bash
        run: bash -n scripts/*.sh

      - name: Validate production and development Compose
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose -f compose.example.yml config -q
          docker compose -f compose.example.yml -f compose.dev.yml config -q

      - name: Build production container
        run: docker build -t homedocker-trakt-bridge:ci .

      # Only the RC.1 Draft pull request exports a short-lived transportable
      # image. Never publish GHCR or change the tag release HOLD from CI.
      # This archive is a runner-built candidate, not a registry manifest digest.


      - name: Enforce runtime image-size budget
        shell: bash
        run: |
          set -euo pipefail
          size=$(docker image inspect homedocker-trakt-bridge:ci --format '{{.Size}}')
          budget=$((122 * 1024 * 1024))
          python3 - "$size" "$budget" <<'PY'
          import sys
          size,budget=map(int,sys.argv[1:3])
          print(f"IMAGE_SIZE_MIB={size/1024/1024:.2f}")
          print(f"IMAGE_BUDGET_MIB={budget/1024/1024:.2f}")
          if size > budget:
              raise SystemExit("runtime image exceeds CI size budget")
          PY

      - name: Smoke-test health and readiness
        shell: bash
        run: |
          set -euo pipefail

          expected_version=$(node -p "require('./package.json').version")
          expected_schema=$(node --input-type=module -e "import { SCHEMA_VERSION } from './src/migrations.mjs'; process.stdout.write(String(SCHEMA_VERSION))")

          docker run -d --name trakt-bridge-ci \
            -p 127.0.0.1:17000:7000 \
            -e PUBLIC_BASE_URL=http://127.0.0.1:17000 \
            -e TRAKT_CLIENT_ID=test-client \
            -e TRAKT_CLIENT_SECRET=test-secret \
            -e BRIDGE_SECRET_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e ADMIN_KEY=abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789 \
            -e PULL_IDENTITY_MODE=trakt \
            homedocker-trakt-bridge:ci

          cleanup() { docker rm -f trakt-bridge-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:17000/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done

          grep -q "\"version\":\"${expected_version}\"" /tmp/health.json

          code=$(curl -sS -o /tmp/readiness.json -w '%{http_code}' http://127.0.0.1:17000/readiness)
          test "$code" = "503"
          grep -q '"status":"setup_required"' /tmp/readiness.json
          grep -q "\"schemaVersion\":${expected_schema}" /tmp/readiness.json

      - name: Package RC.1 reviewed Docker image as checksum-verified CI artifact
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/v140-rc1-source-candidate-20261018' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "1.4.0-rc.1"
          grep -q 'V140_STABLE_RELEASE_HOLD' .github/workflows/release.yml
          mkdir -p /tmp/v140-rc1-ci-image
          short_sha="$(git rev-parse --short=12 HEAD)"
          image="homedocker-trakt-bridge:v1.4.0-rc.1-ci-${short_sha}"
          docker tag homedocker-trakt-bridge:ci "$image"
          docker save -o /tmp/v140-rc1-ci-image/bridge-rc1.docker.tar "$image"
          (
            cd /tmp/v140-rc1-ci-image
            sha256sum bridge-rc1.docker.tar > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          {
            echo 'artifact_kind=docker-save-ci-image'
            echo 'publication=NONE'
            echo 'stable_release_hold=ACTIVE'
            echo "source_checkout_sha=$(git rev-parse HEAD)"
            echo "source_pr_head_sha=${{ github.event.pull_request.head.sha }}"
            echo "image_tag=$image"
            echo "local_image_id=$(docker image inspect "$image" --format '{{.Id}}')"
            echo 'registry_manifest_digest=NOT_AVAILABLE_UNPUBLISHED'
            echo 'credentials_included=NONE_IN_DOCKERFILE'
          } > /tmp/v140-rc1-ci-image/IMAGE-METADATA.txt
          test "$(du -m /tmp/v140-rc1-ci-image/bridge-rc1.docker.tar | cut -f1)" -lt 200

      - name: Upload 7-day RC.1 CI image artifact, never GHCR
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/v140-rc1-source-candidate-20261018' }}
        uses: actions/upload-artifact@v4
        with:
          name: v140-rc1-ci-image-${{ github.run_id }}
          path: /tmp/v140-rc1-ci-image/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
