name: One-time v1 release page housekeeping

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v1-release-page-housekeeping.yml'

permissions:
  contents: write

jobs:
  sync-release-body:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync v1.0.0 release body from versioned release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f docs/releases/v1.0.0.md
          gh release edit v1.0.0 \
            --title "v1.0.0 — Stable release" \
            --notes-file docs/releases/v1.0.0.md
